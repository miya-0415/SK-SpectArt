services:
  # dbという名前のデータベース機能（コンテナ）を作ります
  db:
    image: mysql:latest
    container_name: spectart-db
    restart: always
    # データベースの接続設定（全員共通にする）
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spectart_db
      MYSQL_USER: spectart_user
      MYSQL_PASSWORD: root
    # パソコンのポート「3306」と、Dockerの中の「3306」を繋ぐ
    ports:
      - "3306:3306"
    # データを自分のPC側に保存して、Dockerを消してもデータが消えないようにする
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./image_generate
    container_name: spectart-api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./image_generate/.env
    environment:
      # プロンプト案の切り替え（1=絵画寄り / 2=線主体）
      - PROMPT_VARIANT=${PROMPT_VARIANT:-1}
      # 指標レンジの較正（1=実測分布に合わせる）
      - CALIBRATED=${CALIBRATED:-0}
    # ソースを直接マウントして、編集を再ビルドなしで反映させる
    volumes:
      - ./image_generate:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectart-frontend
    restart: always
    command: sh -c "npx prisma db push --schema=db/schema.prisma && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/spectart_db
      - JWT_SECRET=change-this-to-a-random-secret-in-production
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mysql_data: